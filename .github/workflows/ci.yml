name: CI Pipeline

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, review_requested, submitted]
    branches:
      - develop
      
permissions:
  contents: read
  pull-requests: write
  
jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
        
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
          
      - name: Restore dependencies
        run: dotnet restore NewsWebsite.sln
        
      - name: Build
        run: dotnet build NewsWebsite.sln --no-restore --configuration Release
        
      - name: Run tests
        run: dotnet test NewsWebsite.sln --no-build --verbosity normal --logger "trx;LogFileName=report.trx" --configuration Release

  analysis:
    name: Static Analysis / Metrics
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  

      - name: Count lines of code with Cloc
        run: |
          sudo apt-get update
          sudo apt-get install -y cloc
          cloc . > cloc-report.txt
          cat cloc-report.txt

      - name: Upload CLOC report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: cloc-report
          path: cloc-report.txt
          retention-days: 30

          
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install jq
        run: sudo apt-get install -y jq
        
      - name: Start SonarQube
        run: |
          docker run -d \
            --name sonarqube \
            -p 9000:9000 \
            sonarqube:latest
          echo "Waiting for SonarQube to start..."
          until curl -s http://localhost:9000/api/system/status | grep -q '"status":"UP"'; do
            sleep 5
          done
          echo "SonarQube is up!"

      - name: Setup SonarQube project and token
        run: |
          # Change default admin password
          curl -u admin:admin -X POST \
            "http://localhost:9000/api/users/change_password?login=admin&previousPassword=admin&password=Admin123456!"
          
          # Create project
          curl -u admin:Admin123456! -X POST \
            "http://localhost:9000/api/projects/create?project=NewsWebsite&name=NewsWebsite"
          
          # Generate token
          TOKEN=$(curl -u admin:Admin123456! -X POST \
            "http://localhost:9000/api/user_tokens/generate?name=ci-token" \
            | jq -r '.token')
          echo "SONAR_TOKEN=$TOKEN" >> $GITHUB_ENV

      - name: Install SonarScanner for .NET
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Run SonarQube analysis
        run: |
          export PATH="$PATH:$HOME/.dotnet/tools"
          
           # Begin SonarQube analysis
          dotnet sonarscanner begin \
            /k:"NewsWebsite" \
            /n:"NewsWebsite" \
            /d:sonar.host.url="http://localhost:9000" \
            /d:sonar.login="$SONAR_TOKEN" \
            /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml" \
            /d:sonar.scanner.skipJreProvisioning=true \
            /d:sonar.sourceEncoding="UTF-8" 
          
          # Build the project
          dotnet build NewsWebsite.sln --no-incremental --configuration Release
          
          # Run tests with coverage
          dotnet test NewsWebsite.sln \
            --no-build \
            --configuration Release \
            --collect:"XPlat Code Coverage" \
            --results-directory ./TestResults \
            --settings coverlet.runsettings \
            --verbosity normal
          
          # End SonarQube analysis
          dotnet sonarscanner end /d:sonar.login="$SONAR_TOKEN"
          
      - name: Upload SonarQube full logs
        uses: actions/upload-artifact@v4
        with:
          name: sonarqube-full-logs
          path: |
            .sonarqube/out/
            TestResults/
          retention-days: 30

      - name: Install reviewdog
        run: |
          curl -sfL https://raw.githubusercontent.com/reviewdog/reviewdog/master/install.sh | sh -s -- -b /usr/local/bin
          reviewdog -version
          
      - name: Restore
        run: dotnet restore NewsWebsite.sln

      - name: Run analyzers (Reviewdog)
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dotnet format NewsWebsite.sln analyzers --verify-no-changes --no-restore > analyzers-raw.txt 2>&1 || true
          sed "s|$(pwd)/||g" analyzers-raw.txt > analyzers-clean.txt
      
          cat analyzers-clean.txt | reviewdog \
            -efm="%f(%l,%c): %t %m" \
            -efm="%f(%l,%c): %m" \
            -name="dotnet-analyzers" \
            -reporter="github-pr-review" \
            -filter-mode="added" \
            -level="error"
          
      - name: Run formatter (Reviewdog)
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dotnet format NewsWebsite.sln style --verify-no-changes --no-restore > format-raw.txt 2>&1 || true
          sed "s|$(pwd)/||g" format-raw.txt > format-clean.txt
      
          cat format-clean.txt | reviewdog \
            -efm="%f(%l,%c): %t %m" \
            -efm="%f(%l,%c): %m" \
            -name="dotnet-format" \
            -reporter="github-pr-review" \
            -filter-mode="added" \
            -level="info"

      - name: Upload reviewdog logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reviewdog-logs
          path: |
            analyzers-raw.txt
            format-raw.txt
          retention-days: 30
      
  review-check:
    name: Code Review Check for develop
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 
        
      - name: Verify approved code review
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }} 
          script: |
            const pr = context.payload.pull_request;
            if (!pr) {
              core.setFailed("Це не Pull Request");
              return;
            }
            const { data: reviews } = await github.rest.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number
            });
            const approved = reviews.some(r => r.state === 'APPROVED');
            if (!approved) {
              core.setFailed("Код-рев'ю не схвалено");
            }
